upstream logitrack_backend {
    server web:8000; # Указываем имя сервиса Django из docker-compose
}

server {
    listen 80;
    server_name _;

    # 1. Раздача статических файлов собранного React (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # Перенаправление на index.html для SPA-роутинга
    }

    # 2. Проксирование всех запросов к API на Gunicorn (Django)
    location /api/ {
        proxy_pass http://logitrack_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Раздача интерактивного HTML-отчета покрытия тестами
    location /coverage/ {
        alias /usr/share/nginx/coverage/;
        index index.html;
        try_files $uri $uri/ =404;
    }
}