
name: logitrack_spa_service

services:

  # 1. Локальная PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: logitrack_db
    restart: unless-stopped

    volumes:
      - logitrack_db_data:/var/lib/postgresql/data

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5


  # 2. Django Backend
  web:
    build: .
    container_name: logitrack_web
    restart: unless-stopped

    volumes:
      - .:/app
      - static_volume:/app/staticfiles

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/shipments/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s


volumes:
  logitrack_db_data:
  static_volume:
