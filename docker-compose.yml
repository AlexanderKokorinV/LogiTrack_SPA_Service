services:

  # 1. База данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: logitrack_db
    restart: always
    volumes:
      - logitrack_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    env_file:
      - .env
    expose:
      - "5432" # порт скрыт внутри сети Docker, внешнего подключения нет
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Веб-приложение Django (Бэкенд)
  web:
    build: .
    container_name: logitrack_web
    restart: always
    # При старте собираем Django-статику (для админки) и запускаем WSGI-сервер Gunicorn
    command: sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy # Ждем, пока БД будет полностью готова принимать соединения
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/shipments/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Веб-сервер Nginx (Фронтенд + Прокси)
  nginx:
    # Вместо готового образа используем сборку из папки frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logitrack_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htmlcov:/usr/share/nginx/coverage:ro
      - static_volume:/usr/share/nginx/html/static:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  logitrack_db_data:
  static_volume: